<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নতুন পাসওয়ার্ড সেট করুন</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{margin:0;background:#0c1017;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;padding:20px}.card{background:#161d27;width:100%;max-width:420px;padding:36px 30px;border-radius:14px;border:1px solid #ffffff10;box-shadow:0 25px 60px #0009}h1{font-size:22px;text-align:center;margin:0 0 8px}.subtitle{text-align:center;color:#9ba9b3;font-size:14px;margin:0 0 24px}.group{margin:16px 0}.group label{display:block;color:#c5cdd4;font-size:14px;margin-bottom:6px}.group input{width:100%;padding:12px 14px;background:#0b0f15;border:1px solid #263342;border-radius:8px;color:white;font-size:15px}.group input:focus{outline:2px solid #0984e3}.submit{width:100%;border:0;border-radius:8px;padding:12px;background:#0984e3;color:white;font-size:15px;font-weight:700;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}.message{display:none;padding:12px;border-radius:7px;font-size:14px;margin:16px 0}.message.error{display:block;background:#eb4d4b26;border:1px solid #eb4d4b;color:#ff9292}.message.success{display:block;background:#2ecc7120;border:1px solid #27ae60;color:#8bf0aa}.back{display:block;text-align:center;color:#74b9ff;margin-top:18px;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>🔑 নতুন পাসওয়ার্ড সেট করুন</h1>
    <p class="subtitle">ইমেইলের রিসেট লিংক দিয়ে নতুন পাসওয়ার্ড তৈরি করুন।</p>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <form id="resetForm">
      <div class="group"><label for="password">নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="group"><label for="confirmPassword">আবার পাসওয়ার্ড লিখুন</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="submit" id="submitButton" type="submit">পাসওয়ার্ড সংরক্ষণ করুন</button>
    </form>
    <a class="back" href="./login.html">লগইন পাতায় ফিরে যান</a>
  </main>
  <script type="module">
    import { supabase } from "./supabase-client.js";
    const form=document.getElementById("resetForm");
    const password=document.getElementById("password");
    const confirmPassword=document.getElementById("confirmPassword");
    const message=document.getElementById("message");
    const button=document.getElementById("submitButton");
    form.addEventListener("submit",async(event)=>{
      event.preventDefault();
      message.className="message";
      if(password.value!==confirmPassword.value){message.textContent="দুটি পাসওয়ার্ড মিলছে না। আবার লিখুন।";message.className="message error";return;}
      if(password.value.length<8){message.textContent="পাসওয়ার্ড অন্তত ৮ অক্ষরের হতে হবে।";message.className="message error";return;}
      button.disabled=true;button.textContent="সংরক্ষণ হচ্ছে…";
      try{
        const {data:{session},error:sessionError}=await supabase.auth.getSession();
        if(sessionError) throw sessionError;
        if(!session) throw new Error("RESET_LINK_INVALID");
        const {error}=await supabase.auth.updateUser({password:password.value});
        if(error) throw error;
        message.innerHTML='পাসওয়ার্ড বদলে গেছে। এখন <a href="./login.html" style="color:#8bf0aa">লগইন পাতায়</a> গিয়ে নতুন পাসওয়ার্ড দিয়ে প্রবেশ করুন।';
        message.className="message success";
        form.hidden=true;
      }catch(error){
        console.error("Password reset failed:",error);
        message.textContent=error.message==="RESET_LINK_INVALID"?"রিসেট লিংকটি মেয়াদোত্তীর্ণ বা আগে ব্যবহার করা হয়েছে। লগইন পাতা থেকে নতুন রিসেট ইমেইল চান।":"পাসওয়ার্ড সংরক্ষণ হয়নি। লিংকটি বৈধ কি না দেখে আবার চেষ্টা করুন।";
        message.className="message error";
      }finally{button.disabled=false;button.textContent="পাসওয়ার্ড সংরক্ষণ করুন";}
    });
  </script>
</body>
</html>
