<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন অথেন্টিকেশন - সুরক্ষিত লগইন</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Hind Siliguri',sans-serif; }
        body { background:#0c1017; min-height:100vh; display:flex; align-items:center; justify-content:center; color:#fff; }
        .login-card { background:#161d27; width:100%; max-width:400px; padding:38px 32px; border-radius:14px; box-shadow:0 25px 60px rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.06); }
        .login-card h2 { font-size:22px; margin-bottom:8px; text-align:center; }
        .login-card p { font-size:13px; color:#8c9ba5; text-align:center; margin-bottom:26px; }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:13px; color:#b0bec5; margin-bottom:6px; }
        .form-group input { width:100%; padding:12px 15px; background:#0b0f15; border:1px solid #263342; border-radius:8px; color:#fff; outline:none; font-size:14px; }
        .form-group input:focus { border-color:#0984e3; }
        .btn-submit { width:100%; background:#0984e3; color:#fff; border:none; padding:12px; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
        .btn-submit:hover { background:#076fc0; }
        .alert-error { background:rgba(235,77,75,0.15); border:1px solid #eb4d4b; color:#ff7979; padding:10px; border-radius:6px; font-size:13px; margin-bottom:18px; display:none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 অ্যাডমিন অথেন্টিকেশন</h2>
        <p>সিস্টেম ম্যানেজমেন্ট প্যানেলে প্রবেশের জন্য লগইন করুন</p>
        <div class="alert-error" id="errBox"></div>
        <form id="adminLoginForm">
            <div class="form-group">
                <label>অ্যাডমিন ইউজারনেম</label>
                <input type="text" id="username" required autocomplete="username" placeholder="ইউজারনেম লিখুন">
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">লগইন করুন</button>
        </form>
    </div>
    <script>
        document.getElementById('adminLoginForm').onsubmit = async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('errBox');
            errBox.style.display = 'none';
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errBox.innerText = data.error || 'লগইন ব্যর্থ হয়েছে।';
                    errBox.style.display = 'block';
                }
            } catch(err) {
                errBox.innerText = 'সার্ভার যোগাযোগে সমস্যা হয়েছে।';
                errBox.style.display = 'block';
            }
        };
    </script>
</body>
</html>
